# Koyeb Production App Specification
# https://www.koyeb.com/docs/reference/app-specification
name: campushub
services:
  - name: backend
    type: web
    instance_type: nano
    regions:
      - fra
    ports:
      - port: 5000
        path: /
    routes:
      - path: /
        port: 5000
    health_checks:
      - http:
          port: 5000
          path: /api/health
        interval: 30
        timeout: 5
    scalings:
      - min: 1
        max: 1
    git:
      repository: github.com/Amit470-singh/CampusHub
      branch: main
      build_command: cd backend && npm install
      run_command: node backend/src/server.js
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: FRONTEND_ORIGIN
        value: "https://amit470-singh.github.io"
